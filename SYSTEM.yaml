# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: research.eph-census.align
repository:
  id: repo.eph-censo-aligner
  github: matuteiglesias/eph-censo-aligner
domain: research
system: research.eph-census
role: semantic-alignment-component
lifecycle: maintenance
authority:
  status: proposed
  owns:
  - versioned EPH-to-Census and Census-to-EPH semantic mappings
  - validation, loss/ambiguity reporting and alignment outputs
  - vocabulary for declaring model-facing deployment observability
  does_not_own:
  - raw EPH or Census acquisition
  - Argentine geography authority or geographic crosswalks
  - income model ownership or model selection
  - Census sample inference execution
  - statistical transport claims between EPH and Census
interfaces:
  consumes:
  - artifact:research.eph-source@1
  - artifact:research.census-source@1
  - artifact:research.census-geography@1 (optional identity input)
  produces:
  # Historical artifact identifier retained for compatibility. Semantically this
  # is a variable/alignment release, not a geographic crosswalk.
  - artifact:research.eph-census-crosswalk@1
  manifest_schema: research-artifact-manifest/v1
  compatibility: aligner/compatibility.json
upstream:
- repo.microdatos-eph-indec
downstream:
- repo.income-modeling-eph
- repo.sampler-censo-arg
canonical_commands:
- make check
- make test
- make smoke
- make release-fixture
generated_paths:
- out/
verification:
  status: fixture-implemented-runtime-pending
  last_verified: '2026-08-04'
  command: make check && make test && make smoke && make release-fixture
  supported_vintages:
  - fixture-v1
  unknowns:
  - all real EPH and Census source vintages require evidence and methodological approval
  - no deployment feature category is approved for real Census inference yet
maintenance:
  cadence: annual
  next_review: '2027-08-01'
