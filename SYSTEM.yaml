# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: research.eph-census.align
repository:
  id: repo.eph-censo-aligner
  github: matuteiglesias/eph-censo-aligner
domain: research
system: research.eph-census
role: harmonization-component
lifecycle: maintenance
authority:
  status: proposed
  owns:
  - EPH-to-Census mappings, validation, and alignment outputs
  does_not_own:
  - raw EPH acquisition
  - income model ownership
  - synthetic population product
interfaces:
  consumes:
  - artifact:research.eph-source@1
  - artifact:research.census-source@1
  - artifact:research.census-geography@1 (optional)
  produces:
  - artifact:research.eph-census-crosswalk@1
  manifest_schema: research-artifact-manifest/v1
  compatibility: aligner/compatibility.json
upstream:
- repo.microdatos-eph-indec
downstream:
- repo.income-modeling-eph
canonical_commands:
- make check
- make test
- make smoke
- make release-fixture
generated_paths:
- out/
verification:
  status: fixture-implemented-runtime-pending
  last_verified: '2026-08-04'
  command: make check && make test && make smoke && make release-fixture
  supported_vintages:
  - fixture-v1
  unknowns:
  - all real EPH and Census source vintages require evidence and methodological approval
maintenance:
  cadence: annual
  next_review: '2027-08-01'
