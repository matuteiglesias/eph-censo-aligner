name: Feature plane CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/feature-plane-ci.yml
      - pyproject.toml
      - aligner/feature_plane.py
      - aligner/legacy_bridge_review.py
      - aligner/codebook.py
      - aligner/codebooks/**
      - aligner/real_semantic_plane.py
      - aligner/real_semantic_cli.py
      - aligner/review_inventories/historical_staged_v1.json
      - aligner/review_inventories/historical_staged_v1_legacy_bridge.json
      - tests/test_feature_plane.py
      - tests/test_legacy_bridge_review.py
      - tests/test_codebook.py
      - tests/test_real_semantic_plane.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/feature-plane-ci.yml
      - pyproject.toml
      - aligner/feature_plane.py
      - aligner/legacy_bridge_review.py
      - aligner/codebook.py
      - aligner/codebooks/**
      - aligner/real_semantic_plane.py
      - aligner/real_semantic_cli.py
      - tests/test_feature_plane.py
      - tests/test_legacy_bridge_review.py
      - tests/test_codebook.py
      - tests/test_real_semantic_plane.py

permissions:
  contents: read

jobs:
  semantic-review-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and bounded test tools
        run: python -m pip install -e .[test] ruff
      - name: Lint feature-plane boundary
        run: >-
          ruff check
          aligner/feature_plane.py
          aligner/legacy_bridge_review.py
          aligner/codebook.py
          aligner/real_semantic_plane.py
          aligner/real_semantic_cli.py
          tests/test_feature_plane.py
          tests/test_legacy_bridge_review.py
          tests/test_codebook.py
          tests/test_real_semantic_plane.py
      - name: Verify feature-plane boundary
        run: >-
          pytest -q
          tests/test_feature_plane.py
          tests/test_legacy_bridge_review.py
          tests/test_codebook.py
          tests/test_real_semantic_plane.py
      - name: Compile review artifacts and prove CLI surface
        run: |
          python -m aligner.feature_plane \
            --output /tmp/historical_staged_v1_feature_plane.json
          python -m aligner.legacy_bridge_review \
            --output /tmp/historical_staged_v1_legacy_bridge_gap.json
          semantic-plane --help >/tmp/semantic-plane-help.txt
