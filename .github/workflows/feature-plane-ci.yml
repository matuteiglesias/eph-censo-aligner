name: Feature plane CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/feature-plane-ci.yml
      - aligner/feature_plane.py
      - aligner/review_inventories/historical_staged_v1.json
      - tests/test_feature_plane.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/feature-plane-ci.yml
      - aligner/feature_plane.py
      - aligner/review_inventories/historical_staged_v1.json
      - tests/test_feature_plane.py

permissions:
  contents: read

jobs:
  semantic-review-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded test tools
        run: python -m pip install pytest ruff
      - name: Lint feature-plane boundary
        run: ruff check aligner/feature_plane.py tests/test_feature_plane.py
      - name: Verify feature-plane boundary
        run: pytest -q tests/test_feature_plane.py
      - name: Compile review artifact
        run: >-
          python -m aligner.feature_plane
          --output /tmp/historical_staged_v1_feature_plane.json
